name: Refresh public price snapshot

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: public-price-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate, verify, and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          attest() {
            local sha="$1"
            if gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" --jq '.check_runs[] | select(.name == "refresh-verify" and .status == "completed" and .conclusion == "success") | .id' | grep -q .; then
              return 0
            fi
            for check_attempt in 1 2 3 4 5; do
              if gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
                -f name='refresh-verify' \
                -f head_sha="$sha" \
                -f status='completed' \
                -f conclusion='success' \
                -f 'output[title]=Verified public price snapshot' \
                -f 'output[summary]=All required collectors, snapshot integrity gates, TypeScript, dependency audit, and the full automated test suite passed before publication.'; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach origin/main
            npm ci
            cp data/vercel-snapshot.db data/pricemcp.db
            export PRICEMCP_REFRESH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            npm run collect
            npm run snapshot:vercel
            node scripts/verify-snapshot-refresh.mjs
            npm run check
            npm test
            npm audit --audit-level=high
            git add -f data/vercel-snapshot.db
            if git diff --cached --quiet; then
              attest "$(git rev-parse HEAD)"
              echo 'Snapshot unchanged.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -m 'data: refresh public price snapshot'
            if git push origin HEAD:main; then
              published_sha=$(git rev-parse HEAD)
              attest "$published_sha"
              echo 'Published a verified no-cost snapshot refresh.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Main moved during attempt $attempt; regenerating from its latest tip."
          done
          echo 'Main kept moving; no stale artifact was published.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
